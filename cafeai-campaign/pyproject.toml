[project]
name = "cafeai-campaign"
version = "0.1.0"
description = "Cafe.AI Launch es un agente especializado en diseñar la primera campaña publicitaria de Cafe.AI. Analiza el producto, público objetivo y propuesta de valor para definir la estrategia de lanzamiento, mensajes clave, canales de comunicación y contenidos promocionales. Su objetivo es generar una campaña coherente y atractiva que permita posicionar Cafe.AI, captar sus primeros usuarios y establecer una base para futuras campañas de marketing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "firecrawl-anydoc==0.2.4",
    "google-search-results==2.4.2",
    "langchain==1.4.0",
    "langchain-community==0.4.2",
    "langchain-core==1.6.2",
    "langchain-openai==1.6.0",
    "langchain-text-splitters==1.1.2",
    "langfuse==4.9.0",
    "langgraph==1.2.11",
    "deepeval==4.2.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdf==6.18.0",
    "requests==2.34.2",
    "serpapi==1.1.0",
    "textual==8.2.8",
]
