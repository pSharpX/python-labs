databaseChangeLog:
  - property:
      name: json.type
      value: json
      dbms: mysql, postgresql
  - property:
      name: json.type
      value: clob
      dbms: oracle, h2, mssql
  - changeSet:
      id: create-authors-table
      author: christian.rivera
      comment: add authors table definition
      changes:
        - createTable:
            tableName: authors
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: fullname
                  type: varchar(100)
                  constraints:
                    nullable: true
  - changeSet:
      id: create-categories-table
      author: christian.rivera
      comment: add categories table definition
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(1000)
                  constraints:
                    nullable: true
  - changeSet:
      id: create-books-table
      author: christian.rivera
      comment: add books table definition
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: author_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(1000)
                  constraints:
                    nullable: true
              - column:
                  name: rating
                  type: float
                  constraints:
                    nullable: false
              - column:
                  name: published_date
                  type: int
                  constraints:
                    nullable: false
  - changeSet:
      id: add-books-foreign-keys
      author: christian.rivera
      changes:
        - addForeignKeyConstraint:
            baseTableName: books
            baseColumnNames: author_id
            referencedTableName: authors
            referencedColumnNames: id
            constraintName: fk_books_authors
        - addForeignKeyConstraint:
            baseTableName: books
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_books_categories
  - changeSet:
      id: default-author-record
      author: christian.rivera
      comment: insert default author record for testing
      changes:
        - insert:
            tableName: authors
            columns:
              - column:
                  name: name
                  value: 'John'
              - column:
                  name: fullname
                  value: 'Code With John'
  - changeSet:
      id: default-category-record
      author: christian.rivera
      comment: insert default category record for testing
      changes:
        - insert:
            tableName: categories
            columns:
              - column:
                  name: name
                  value: 'Software Development'
              - column:
                  name: description
                  value: 'Software Development and Computer Science'
  - changeSet:
      id: default-book-record
      author: christian.rivera
      comment: insert default book record for testing
      changes:
        - sql:
            dbms: postgresql, mysql
            comment: 'Insert a book referencing the author ID and category ID'
            splitStatements: true
            endDelimiter: ';'
            stripComments: true
            sql: |
              INSERT INTO books (title, description, rating, published_date, author_id, category_id)
              VALUES ('Python Programming', 'Python Programming', 4, 2020, (SELECT id FROM authors WHERE name = 'John'),(SELECT id FROM categories WHERE name = 'Software Development'));
  - changeSet:
      id: create-users-table
      author: christian.rivera
      comment: add users table definition
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_user_id
              - column:
                  name: ext_user_id
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: u_ext_user_id
              - column:
                  name: first_name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: email
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime2
                  constraints:
                    nullable: false
              - column:
                  name: status # ACTIVE, BLOCKED,
                  type: varchar(30)
                  constraints:
                    nullable: false
  - changeSet:
      id: create-books-copy-table
      author: christian.rivera
      comment: add books copy table definition. This table is intended to be used for physical or rentable copies
      changes:
        - createTable:
            tableName: books_copy
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_book_copy_id
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_books_copy_book
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: physical_identifier
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: status # AVAILABLE, RENTED, LOST, DAMAGED
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: acquisition_date
                  type: datetime2
                  constraints:
                    nullable: false
  - changeSet:
      id: create-rental-table
      author: christian.rivera
      comment: add rental table definition. This represents a rental transaction
      changes:
        - createTable:
            tableName: rental
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_rental_id
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rental_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: status # ACTIVE, RETURNED, LATE
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: rental_date
                  type: datetime2
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: datetime2
                  constraints:
                    nullable: false
              - column:
                  name: return_date
                  type: datetime2
                  constraints:
                    nullable: true
  - changeSet:
      id: create-rental-detail-table
      author: christian.rivera
      comment: add rental-detail table definition.
      changes:
        - createTable:
            tableName: rental_detail
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_rental_detail_id
              - column:
                  name: rental_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rental_detail_rental
                    referencedTableName: rental
                    referencedColumnNames: id
              - column:
                  name: copy_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rental_detail_books_copy
                    referencedTableName: books_copy
                    referencedColumnNames: id
              - column:
                  name: return_at
                  type: datetime2
                  constraints:
                    nullable: true
  - changeSet:
      id: create-reviews-table
      author: christian.rivera
      comment: add reviews table definition.
      changes:
        - createTable:
            tableName: reviews
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_review_id
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reviews_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: book_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reviews_book
                    referencedTableName: books
                    referencedColumnNames: id
              - column:
                  name: review_text
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: rating
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime2
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: datetime2
                  constraints:
                    nullable: false
  - changeSet:
      id: add_unique_constraint_reviews
      author: christian.rivera
      changes:
        - addUniqueConstraint:
            columnNames: user_id, book_id
            constraintName: uc_reviews_user_id_book_id
            tableName: reviews
  - changeSet:
      id: create-notifications-table
      author: christian.rivera
      comment: add notifications table definition.
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_notification_id
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notifications_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: rental_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notifications_rental
                    referencedTableName: rental
                    referencedColumnNames: id
              - column:
                  name: type # DUE_REMINDER, OVERDUE, PROMOTION
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: channel # EMAIL, SMS
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status # PENDING, SENT, FAILED
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_at
                  type: datetime2
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime2
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: datetime2
                  constraints:
                    nullable: false
  - changeSet:
      id: add_unique_constraint_users
      author: christian.rivera
      changes:
        - addUniqueConstraint:
            columnNames: email
            constraintName: uc_users_email
            tableName: users
  - changeSet:
      id: add_unique_constraint_physical_identifier
      author: christian.rivera
      changes:
        - addUniqueConstraint:
            columnNames: physical_identifier
            constraintName: uc_books_copy_physical_identifier
            tableName: books_copy
  - changeSet:
      id: drop_notnullconstraint_ext_user_id
      author: christian.rivera
      changes:
        - dropNotNullConstraint:
            columnDataType: varchar(100)
            columnName: ext_user_id
            tableName: users
  - changeSet:
      id: add_user_id_column_users
      author: christian.rivera
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uc_user_id
  - changeSet:
      id: create-outbox-table
      author: christian.rivera
      comment: add outbox table definition for transactional operations.
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_id
              - column:
                  name: event_type # user.created, etc
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: ${json.type}
                  constraints:
                    nullable: false
              - column:
                  name: processed
                  type: bit
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime2
                  constraints:
                    nullable: false
  - changeSet:
      id: add_user_registration_status_column_users
      author: christian.rivera
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: user_registration_status
                  type: varchar(30)
                  constraints:
                    nullable: false

