databaseChangeLog:
  - property:
      name: json.type
      value: json
      dbms: mysql, postgresql
  - property:
      name: json.type
      value: clob
      dbms: oracle, h2, mssql
  - changeSet:
      id: enable-pgvector
      author: christian.rivera
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS vector;
  - changeSet:
      id: enable-pgcrypto
      author: christian.rivera
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pgcrypto;
  - changeSet:
      id: create-business_lines-table
      author: christian.rivera
      comment: add business_lines table definition
      changes:
        - createTable:
            tableName: business_lines
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: INT
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: main_families
                  type: VARCHAR(1000)
  - changeSet:
      id: create-families-table
      author: christian.rivera
      comment: add families table definition
      changes:
        - createTable:
            tableName: families
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: line_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_family_line
                    references: business_lines(id)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: create-products_services-table
      author: christian.rivera
      comment: add products_services table definition
      changes:
        - createTable:
            tableName: products_services
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: family_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_family
                    references: families(id)
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: smb_applicable
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: corp_applicable
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT

