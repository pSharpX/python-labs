                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: code_example
                  type: VARCHAR(100)

  - changeSet:
      id: create-surcharge-table
      author: christian.rivera
      comment: add surcharge table definition
      changes:
        - createTable:
            tableName: surcharge
            columns:
              - column:
                  name: code
                  type: VARCHAR(20)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: condition
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: factor
                  type: NUMERIC(5, 2)
                  constraints:
                    nullable: false
              - column:
                  name: rule
                  type: TEXT

