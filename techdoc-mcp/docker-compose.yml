
services:
  neo4j:
    image: neo4j:2025.10.1-community-bullseye
    profiles: [rag]
    container_name: neo4j
    ports:
      - "7474:7474" # Neo4j HTTP
      - "7473:7473" # Neo4j HTTPS
      - "7687:7687" # Neo4j Bolt
    environment:
      - NEO4J_AUTH=${GRAPH_USER}/${GRAPH_PASS}
      - NEO4J_initial_dbms_default__database=${GRAPH_NAME}
      - NEO4J_PLUGINS=["apoc", "bloom", "graph-data-science", "genai"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u ${GRAPH_USER} -p ${GRAPH_PASS} -d ${GRAPH_NAME} 'RETURN 1'" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/import
      - ./plugins:/plugins

  pgvector:
    image: pgvector/pgvector:pg16
    profiles: [rag]
    container_name: pgvector
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5442:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  liquibase:
    profiles: [rag]
    build:
      context: ./liquibase
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - ${PWD}/db/changelog/:/liquibase/changelog
    command: >
      --changeLogFile=./db.changelog-1.0.yaml
      --url=jdbc:postgresql://pgvector:5432/${DB_NAME}
      --driver=org.postgresql.Driver
      --classpath=/liquibase/changelog
      --username=${DB_USER}
      --password=${DB_PASS}
      update

  liquibase-neo4j:
    profiles: [ rag ]
    build:
      context: ./liquibase
    container_name: liquibase-neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ${PWD}/graphs/changelog/:/liquibase/changelog
    command: >
      --changeLogFile=./graphs.changelog-1.0.yaml
      --url=jdbc:neo4j:bolt://neo4j:7687/${GRAPH_NAME}
      --classpath=/liquibase/changelog
      --username=${GRAPH_USER}
      --password=${GRAPH_PASS}
      update

volumes:
  pgvector_data:
  neo4j_data:
  neo4j_logs: