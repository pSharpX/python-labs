
services:
  neo4j:
    image: neo4j:2025.10.1-community-bullseye
    profiles: [rag]
    container_name: neo4j
    ports:
      - "7474:7474" # Neo4j HTTP
      - "7473:7473" # Neo4j HTTPS
      - "7687:7687" # Neo4j Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "bloom", "graph-data-science", "genai"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/import
      - ./plugins:/plugins

  pgvector:
    image: pgvector/pgvector:pg16
    profiles: [rag]
    container_name: pgvector
    restart: always
    environment:
      POSTGRES_USER: pgvector_user
      POSTGRES_PASSWORD: p4ssw0rd
      POSTGRES_DB: vectordb
    ports:
      - "5442:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pgvector_user -d vectordb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  liquibase:
    profiles: [rag]
    build:
      context: ./liquibase
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - ${PWD}/db/changelog/:/liquibase/changelog
    command: >
      --changeLogFile=./db.changelog-1.0.yaml
      --url=jdbc:postgresql://pgvector:5432/vectordb
      --driver=org.postgresql.Driver
      --classpath=/liquibase/changelog
      --username=pgvector_user
      --password=p4ssw0rd
      update


volumes:
  pgvector_data:
  neo4j_data:
  neo4j_logs: