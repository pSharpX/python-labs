version: "3.9"

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSISTIST_DIRECTORY=/data
    restart: unless-stopped

volumes:
  chroma_data:
